# im-bot connector — supervisord config (Docker / container deployment).
# Replace the listener path with your install location (install.sh copies the
# listener to ~/.local/bin/hermes-imbot-listener).
[program:hermes-imbot]
command=python3 /home/USER/.local/bin/hermes-imbot-listener
autorestart=true
autostart=true
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/hermes-imbot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=IMBOT_BACKEND="hermes",IMBOT_TIMEOUT="180"
